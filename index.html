    <!-- SCRIPT 1: TERBACA (BISA DIEDIT PEMBELI)    -->
    <!-- ========================================== -->
    <script>
        function showMsg(title, desc, isError = false) {
            document.getElementById('app-modal-title').innerText = title;
            document.getElementById('app-modal-title').className = isError ? 'text-lg font-bold text-rose-500 mb-2' : 'text-lg font-bold text-slate-100 mb-2';
            document.getElementById('app-modal-desc').innerText = desc;
            document.getElementById('app-modal').classList.remove('hidden');
        }

        const PRESETS = {
            hud: `// HUD Cyber Scanner\nfunction draw(ctx, width, height, time) {\n    ctx.fillStyle = '#00FF00';\n    ctx.fillRect(0, 0, width, height);\n    const cx = width / 2;\n    const cy = height / 2;\n    const scale = Math.min(width, height) * 0.0022;\n    const R = 300 * scale; \n    ctx.save();\n    ctx.translate(cx, cy);\n    ctx.rotate(time);\n    ctx.lineWidth = 10 * scale;\n    ctx.setLineDash([40 * scale, 20 * scale]);\n    ctx.strokeStyle = '#00e5ff';\n    ctx.beginPath();\n    ctx.arc(0, 0, R, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.restore();\n}`,
            particles: `// Neon Vortex\nfunction draw(ctx, width, height, time) {\n    ctx.fillStyle = '#05070a';\n    ctx.fillRect(0, 0, width, height);\n    const cx = width / 2;\n    const cy = height / 2;\n    const count = 80;\n    const scale = Math.min(width, height) * 0.002;\n    ctx.save();\n    ctx.translate(cx, cy);\n    for (let i = 0; i < count; i++) {\n        let angle = (i / count) * Math.PI * 2 + time * 0.8;\n        let dist = (Math.sin(time * 2 + i * 0.1) * 0.3 + 0.6) * (Math.min(width, height) * 0.3);\n        let x = Math.cos(angle) * dist;\n        let y = Math.sin(angle) * dist;\n        ctx.fillStyle = \`hsl(\${(i * 5 + time * 50) % 360}, 100%, 70%)\`;\n        ctx.beginPath();\n        ctx.arc(x, y, 10 * scale, 0, Math.PI * 2);\n        ctx.fill();\n    }\n    ctx.restore();\n}`,
            wave: `// Audio Wave\nfunction draw(ctx, width, height, time) {\n    ctx.fillStyle = '#080c14';\n    ctx.fillRect(0, 0, width, height);\n    const cx = width / 2;\n    const cy = height / 2;\n    const radius = Math.min(width, height) * 0.2;\n    ctx.save();\n    ctx.translate(cx, cy);\n    for (let i = 0; i < 32; i++) {\n        let angle = (i / 32) * Math.PI * 2;\n        let amp = Math.sin(time * 5 + i * 0.5) * 0.5 + 0.5;\n        let x1 = Math.cos(angle) * radius;\n        let y1 = Math.sin(angle) * radius;\n        let x2 = Math.cos(angle) * (radius + amp * radius);\n        let y2 = Math.sin(angle) * (radius + amp * radius);\n        ctx.strokeStyle = '#10b981';\n        ctx.lineWidth = Math.min(width, height) * 0.008;\n        ctx.lineCap = 'round';\n        ctx.beginPath();\n        ctx.moveTo(x1, y1);\n        ctx.lineTo(x2, y2);\n        ctx.stroke();\n    }\n    ctx.restore();\n}`
        };
    </script>

    <!-- SCRIPT 2: KODE INTI & PROTEKSI HARDCODE    -->
    <!-- (BAGIAN INI YANG NANTINYA HARUS ANDA       -->
    <!-- OBFUSCATE JIKA INGIN DIPERJUALBELIKAN)     -->
    <!-- ========================================== -->
    <script>
        const state = { width: 1920, height: 1080, aspect: '16:9', resBase: 1080, fps: 30, bitrate: 40, duration: 6, time: 0, isPlaying: true, isExporting: false, userFunction: null, animationId: null, lastTimestamp: 0 };
        const canvas = document.getElementById('preview-canvas');
        const canvasContainer = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d', { alpha: false });
        const codeEditor = document.getElementById('code-editor');

        function switchTab(targetId) {
            document.querySelectorAll('.mob-tab-btn, .desk-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.target === targetId));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            if (window.innerWidth >= 768) {
                document.getElementById('pane-preview').classList.add('active');
                if(targetId !== 'pane-preview') document.getElementById(targetId)?.classList.add('active');
                else { document.getElementById('pane-code').classList.add('active'); document.querySelector('.desk-tab-btn[data-target="pane-code"]').classList.add('active'); }
            } else document.getElementById(targetId)?.classList.add('active');
        }
        document.querySelectorAll('.mob-tab-btn, .desk-tab-btn').forEach(btn => btn.addEventListener('click', (e) => switchTab(e.currentTarget.dataset.target)));
        window.addEventListener('resize', () => switchTab(document.querySelector('.mob-tab-btn.active').dataset.target));

        function updateDimensions() {
            let resInput = document.querySelector('input[name="res"]:checked')?.value || "1080";
            let aspectInput = document.querySelector('input[name="aspect"]:checked').value;
            let fpsInput = document.getElementById('set-fps').value;
            let bitInput = document.getElementById('set-bitrate').value;
            let durInput = document.getElementById('set-duration').value;

            // PROTEKSI HARDCODE JS UNTUK VERSI GRATIS (Anti Inspect Element)
            state.resBase = Math.min(parseInt(resInput), 1080); // Mengunci maks 1080p
            state.fps = Math.min(parseInt(fpsInput), 30);       // Mengunci maks 30 FPS
            state.duration = Math.max(1, Math.min(30, parseInt(durInput) || 30)); // Mengunci maks 30 detik

            // Kembalikan UI jika dicurangi
            if(parseInt(resInput) > 1080) document.querySelector('input[name="res"][value="1080"]').checked = true;
            document.getElementById('set-fps').value = state.fps;
            document.getElementById('set-duration').value = state.duration;

            state.aspect = aspectInput;
            state.bitrate = parseInt(bitInput);
            
            document.getElementById('timeline-slider').max = state.duration;
            document.getElementById('bitrate-label').innerText = `${state.bitrate} Mbps`;

            if (state.aspect === '16:9') { state.height = state.resBase; state.width = Math.round(state.resBase * 16 / 9); canvasContainer.style.aspectRatio = "16/9"; } 
            else if (state.aspect === '9:16') { state.width = state.resBase; state.height = Math.round(state.resBase * 16 / 9); canvasContainer.style.aspectRatio = "9/16"; } 
            else if (state.aspect === '1:1') { state.width = state.resBase; state.height = state.resBase; canvasContainer.style.aspectRatio = "1/1"; }

            state.width = Math.floor(state.width / 2) * 2; state.height = Math.floor(state.height / 2) * 2;
            canvas.width = state.width; canvas.height = state.height;
            document.getElementById('header-res-info').innerText = `${state.resBase}p • ${state.aspect} • ${state.fps} FPS`;
            
            if(!state.isPlaying && !state.isExporting) renderFrame(state.time);
        }

        document.querySelectorAll('input[name="res"], input[name="aspect"]').forEach(el => el.addEventListener('change', updateDimensions));
        document.getElementById('set-fps').addEventListener('change', updateDimensions);
        document.getElementById('set-bitrate').addEventListener('input', updateDimensions);
        document.getElementById('set-duration').addEventListener('change', updateDimensions);

        function generatePrompt() {
            const m = document.getElementById('prompt-model').value || '[Video Model]';
            const v = document.getElementById('prompt-version').value || '[Video Version]';
            const c = document.getElementById('prompt-category').value || '[Category]';
            document.getElementById('prompt-output').value = `MASTER PROMPT — PROFESSIONAL CANVAS JS MOTION VIDEO GENERATOR\nAct as a Senior Creative Coder... \n\nMODEL: ${m}\nVERSION: ${v}\nCATEGORY: ${c}\n(Copy sisa prompt aslinya di sini)`;
        }
        ['prompt-model', 'prompt-version', 'prompt-category'].forEach(id => document.getElementById(id).addEventListener('input', generatePrompt));
        document.getElementById('btn-copy-prompt').addEventListener('click', () => {
            const text = document.getElementById('prompt-output').value;
            if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showMsg('Berhasil', 'Prompt disalin ke clipboard!'));
            else { document.getElementById('prompt-output').select(); document.execCommand('copy'); showMsg('Berhasil', 'Prompt disalin ke clipboard!'); }
        });

        function compileCode() {
            try {
                const func = new Function('ctx', 'width', 'height', 'time', codeEditor.value + '\nreturn typeof draw === "function" ? draw(ctx, width, height, time) : null;');
                state.userFunction = func;
                if (!state.isPlaying && !state.isExporting) renderFrame(state.time);
            } catch (err) { state.userFunction = null; }
        }

        function renderFrame(timeSec) {
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            if (state.userFunction) {
                try { ctx.save(); state.userFunction(ctx, state.width, state.height, timeSec); ctx.restore(); } 
                catch(e) { ctx.fillStyle = '#00FF00'; ctx.fillRect(0, 0, state.width, state.height); ctx.fillStyle = 'red'; ctx.font = `${Math.max(20, state.width * 0.02)}px monospace`; ctx.fillText("Error: " + e.message, state.width*0.05, state.height*0.1); }
            } else { ctx.fillStyle = '#00FF00'; ctx.fillRect(0, 0, state.width, state.height); }
        }

        function liveLoop(timestamp) {
            if (state.isExporting) return;
            if (!state.lastTimestamp) state.lastTimestamp = timestamp;
            const delta = (timestamp - state.lastTimestamp) / 1000;
            state.lastTimestamp = timestamp;
            if (state.isPlaying) {
                state.time += delta;
                if (state.time > state.duration) state.time = 0; 
                renderFrame(state.time);
                document.getElementById('time-display').innerText = `${state.time.toFixed(2)}s`;
                document.getElementById('timeline-slider').value = state.time;
            }
            state.animationId = requestAnimationFrame(liveLoop);
        }

        async function startExport() {
            if (state.isExporting || !state.userFunction) return;
            if (typeof VideoEncoder === 'undefined' || typeof Mp4Muxer === 'undefined') { showMsg("Error", "Browser tidak mendukung WebCodecs", true); return; }

            state.isExporting = true; state.isPlaying = false;
            cancelAnimationFrame(state.animationId);

            const overlay = document.getElementById('render-overlay');
            const pBar = document.getElementById('progress-bar');
            const pText = document.getElementById('progress-text');
            const pStatus = document.getElementById('render-info-status');
            
            overlay.classList.remove('hidden'); pBar.style.width = '0%'; pText.innerText = `Menyiapkan...`;

            const totalFrames = Math.floor(state.duration * state.fps);
            const frameDuration = 1 / state.fps;

            try {
                const baseTargetBitrate = state.bitrate * 1_000_000;
                let videoConfig = null;
                const codecs = ['avc1.640034', 'avc1.4d0034', 'avc1.420034', 'avc1.640028', 'avc1.4d0028', 'avc1.420028', 'avc1.42E01F', 'avc1.42001E'];
                const accelerations = ['prefer-hardware', 'no-preference', 'prefer-software'];
                const bitrateMultipliers = [1, 0.75, 0.5, 0.25]; 
                
                pStatus.innerText = "Mencari Konfigurasi Hardware...";
                
                findConfig: for (let hw of accelerations) {
                    for (let codec of codecs) {
                        for (let mult of bitrateMultipliers) {
                            const testBitrate = Math.floor(baseTargetBitrate * mult);
                            const testConfig = { codec: codec, width: state.width, height: state.height, bitrate: testBitrate, bitrateMode: 'constant', framerate: state.fps, hardwareAcceleration: hw };
                            try { const support = await VideoEncoder.isConfigSupported(testConfig); if (support.supported) { videoConfig = testConfig; break findConfig; } } catch (e) {}
                        }
                    }
                }

                if (!videoConfig) throw new Error(`Resolusi tidak didukung`);

                let muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: state.width, height: state.height }, fastStart: 'in-memory' });
                let encoderError = null;
                let encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { encoderError = e; } });

                encoder.configure(videoConfig);

                for (let i = 0; i < totalFrames; i++) {
                    if (encoderError) throw new Error(encoderError.message);
                    const currentTime = i * frameDuration;
                    renderFrame(currentTime);
                    let frame = new VideoFrame(canvas, { timestamp: i * Math.floor(1000000 / state.fps) });
                    try { encoder.encode(frame, { keyFrame: i % state.fps === 0 }); } catch (err) { frame.close(); throw err; }
                    frame.close();
                    while (encoder.encodeQueueSize > 1) { if (encoderError) break; await new Promise(r => requestAnimationFrame(r)); }
                    if (i % 5 === 0 || i === totalFrames - 1) {
                        const percent = Math.round(((i + 1) / totalFrames) * 100);
                        pBar.style.width = `${percent}%`; pText.innerText = `Frame ${i + 1} / ${totalFrames} (${percent}%)`;
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                if (encoderError) throw new Error(encoderError.message);
                pStatus.innerText = `Mengepak file MP4...`;
                await encoder.flush(); muxer.finalize(); encoder.close();

                let finalBlob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(finalBlob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = `Export_${state.width}x${state.height}_${state.fps}fps.mp4`;
                document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 200);

            } catch (err) { showMsg("Gagal Merender Video", err.message, true); } 
            finally { state.isExporting = false; overlay.classList.add('hidden'); state.time = 0; state.isPlaying = true; state.lastTimestamp = performance.now(); liveLoop(performance.now()); }
        }

        document.getElementById('preset-select').addEventListener('change', (e) => { codeEditor.value = PRESETS[e.target.value]; compileCode(); });
        document.getElementById('btn-format').addEventListener('click', () => { let code = codeEditor.value; code = code.replace(/;\s*/g, ';\n').replace(/{\s*/g, '{\n  ').replace(/}\s*/g, '\n}\n'); codeEditor.value = code; compileCode(); });
        let typingTimer; codeEditor.addEventListener('input', () => { clearTimeout(typingTimer); typingTimer = setTimeout(compileCode, 400); });
        document.getElementById('btn-play').addEventListener('click', () => { state.isPlaying = true; state.lastTimestamp = performance.now(); });
        document.getElementById('btn-pause').addEventListener('click', () => { state.isPlaying = false; });
        document.getElementById('btn-reset').addEventListener('click', () => { state.time = 0; renderFrame(0); });
        document.getElementById('timeline-slider').addEventListener('input', (e) => { state.isPlaying = false; state.time = parseFloat(e.target.value); renderFrame(state.time); document.getElementById('time-display').innerText = `${state.time.toFixed(2)}s`; });
        document.getElementById('btn-export').addEventListener('click', startExport);

        codeEditor.value = PRESETS.hud; generatePrompt(); updateDimensions(); compileCode();
        state.lastTimestamp = performance.now(); requestAnimationFrame(liveLoop);
        if(window.innerWidth >= 768) { switchTab('pane-code'); }
    </script>
</body>
</html>
